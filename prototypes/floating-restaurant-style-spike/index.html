<meta charset="utf-8">
<title>Floating Restaurant Style Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600&display=swap">
<style>
  /* Full-screen game screen. Cash + day top-left, order tickets top-right, SERVE button bottom-centre, look toggles bottom-left. Single look by choice. */
  :root {
    --ink: #1d1430; --cream: #fff6e0; --paper: #fffdf4; --gold: #ffd23c; --coral: #ff5d5d; --mint: #3fd08a; --sky: #49b8ff; --orange: #ff9a3c;
    --sky-top: #3fb0ff; --sky-bot: #c4f2ff;
    --display: "Lilita One", "Trebuchet MS", sans-serif; --body: "Fredoka", "Trebuchet MS", Verdana, sans-serif;
    color-scheme: light; height: 100%;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; overflow: hidden; font-family: var(--body); color: var(--ink); background: linear-gradient(var(--sky-top), var(--sky-bot) 60%); transition: background 0.8s; user-select: none; -webkit-user-select: none; }
  body.sunset { --sky-top: #5a3fd0; --sky-bot: #ffae6b; }
  #view { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  .stroke { -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }

  /* top-left: cash and day, chunky pills */
  #top { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 8px; background: var(--ink); border-radius: 999px; padding: 4px 16px 4px 4px; box-shadow: 0 4px 0 rgba(0,0,0,0.25); }
  .pill b { font: 400 26px/1 var(--display); color: var(--gold); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
  .pill.day b { color: var(--cream); font-size: 20px; }
  .coin { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3a0, var(--gold) 45%, #e0a000); border: 3px solid var(--ink); display: grid; place-items: center; font: 400 18px var(--display); color: #b07800; }
  .coin.bump { animation: bump 0.25s; }
  @keyframes bump { 50% { transform: scale(1.35); } }
  .star { width: 30px; height: 30px; display: grid; place-items: center; font-size: 22px; color: var(--gold); -webkit-text-stroke: 1.5px var(--ink); }

  /* top-right: Flipline-style order tickets on a rail */
  #rail { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; align-items: flex-start; }
  .tk { width: 74px; background: var(--paper); border: 3px solid var(--ink); border-radius: 6px 6px 12px 12px; padding: 6px 4px 6px; display: grid; justify-items: center; gap: 2px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transform-origin: top center; transition: transform 0.2s; position: relative; }
  .tk::before { content: ""; position: absolute; top: -9px; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); border: 3px solid var(--ink); }
  .tk img { width: 48px; height: 48px; }
  .tk span { font: 600 11px var(--body); text-align: center; line-height: 1.1; }
  .tk .who { font: 400 13px var(--display); color: var(--coral); }
  .tk.urgent { transform: rotate(-4deg) scale(1.06); background: #ffe3e3; }
  .tk.new { animation: drop 0.35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes drop { from { transform: translateY(-40px) rotate(8deg); opacity: 0; } }

  /* bubbles over guests */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bub { position: absolute; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 3px; }
  .bub .think { background: var(--paper); border: 3px solid var(--ink); border-radius: 50%; width: 44px; height: 44px; display: grid; place-items: center; }
  .bub .think img { width: 34px; height: 34px; }
  .bub .bar { width: 52px; height: 10px; background: var(--ink); border-radius: 6px; padding: 2px; box-sizing: border-box; }
  .bub .bar i { display: block; height: 100%; border-radius: 4px; }
  .pop { position: absolute; transform: translate(-50%, -50%); font: 400 32px var(--display); color: var(--gold); -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: rise 1.3s ease-out forwards; white-space: nowrap; }
  .pop.big { font-size: 46px; color: var(--cream); }
  .pop.mad { color: var(--coral); font-size: 28px; }
  .pop.heart { color: #ff6f91; font-size: 26px; }
  @keyframes rise { 0% { transform: translate(-50%, -20%) scale(0.3); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.3); opacity: 1; } 30% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }

  /* buttons */
  button { font: 400 17px var(--display); color: var(--cream); background: var(--mint); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; min-height: 42px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #serve { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 30px; padding: 8px 34px; min-height: 64px; border-radius: 22px; background: var(--orange); box-shadow: 0 7px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); }
  #serve:active { transform: translate(-50%, 5px); box-shadow: 0 2px 0 var(--ink); }
  #serve small { display: block; font: 600 12px var(--body); -webkit-text-stroke: 0; color: var(--ink); }
  #side { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; max-width: 220px; }
  #side .note { background: var(--cream); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px; font-size: 12px; font-weight: 500; line-height: 1.3; }
  #side .note b { font: 400 15px var(--display); color: var(--coral); display: block; }
  #side .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #side button { font-size: 14px; min-height: 36px; padding: 4px 10px; }
  #side button.alt { background: var(--sky); }
  @media (max-width: 720px) {
    #rail { top: calc(60px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); justify-content: flex-start; gap: 4px; }
    .tk { width: 56px; padding: 4px 2px; } .tk img { width: 30px; height: 30px; } .tk span:last-child { display: none; }
    #side .note { display: none; }
    #side { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .pop, .tk.new, .coin.bump { animation-duration: 0.01s; } }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; z-index: 50; background: linear-gradient(var(--sky-top), var(--sky-bot)); }
  #loading h2 { margin: 0; font: 400 44px var(--display); color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); text-align: center; }
  #loading .lbar { width: min(320px, 70vw); height: 22px; background: var(--ink); border-radius: 12px; padding: 4px; box-sizing: border-box; }
  #loading .lbar i { display: block; height: 100%; width: 0; background: var(--mint); border-radius: 8px; transition: width 0.2s; }
  #loading p { margin: 0; font: 600 14px var(--body); }
  @media (prefers-reduced-motion: reduce) { .pop, .tk.new, .coin.bump { animation-duration: 0.01s; } }
</style>

<div id="view"></div>
<div id="labels"></div>
<div id="top">
  <div class="pill"><span class="coin">$</span><b id="cash">$120</b></div>
  <div class="pill day"><span class="star">★</span><b>Day 4 · Dinner</b></div>
</div>
<div id="rail" aria-label="Orders"></div>
<button id="serve" type="button">SERVE!<small>serves the most impatient guest</small></button>

  <div class="row">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  // Models: Quaternius (CC0): Pirate Kit, Sushi Restaurant Kit, Cute Animated Monsters,
  // Ultimate Animated Character Pack, Cute Fish Pack, Ultimate Food Pack (fish and food converted from OBJ).
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('view').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 600);
  const outlineW = { value: 0.0045 }, aspect = { value: 1 };
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); aspect.value = h / w; outlineW.value = 5.0 / h; }
  addEventListener('resize', resize); resize();
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const v3 = new THREE.Vector3();

  // ================= toon kit =================
  const ramp = new THREE.DataTexture(new Uint8Array([150, 150, 150, 215, 215, 215, 255, 255, 255]), 3, 1, THREE.RGBFormat);
  ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
  const INK = 0x1d1430;
  const mats = {};
  const T = (color, o) => { o = o || {}; const k = color + JSON.stringify(o); return mats[k] || (mats[k] = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: ramp }, o))); };
  // Outline: a back-facing copy pushed outwards in SCREEN space, so every model gets the same
  // ink line whatever its size. Works on animated (skinned) characters too.
  function outlineMat(skinned, scale) {
    const sm = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { c: { value: new THREE.Color(INK) }, w: outlineW, asp: aspect, k: { value: scale || 1 } },
      vertexShader: `#include <common>
        #include <skinning_pars_vertex>
        uniform float w; uniform float asp; uniform float k;
        void main(){
          #include <beginnormal_vertex>
          #include <skinbase_vertex>
          #include <skinnormal_vertex>
          #include <begin_vertex>
          #include <skinning_vertex>
          vec4 p = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
          vec3 vn = normalize(normalMatrix * objectNormal);
          vec2 d = (projectionMatrix * vec4(vn, 0.0)).xy;
          float l = length(d); d = l > 0.0 ? d / l : vec2(0.0);
          d.x *= asp;
          p.xy += d * w * k * p.w;
          gl_Position = p;
        }`,
      fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }'
    });
    sm.skinning = !!skinned;
    return sm;
  }
  // Low-poly models have split (hard) normals; the outline needs them averaged or it cracks.
  function smoothGeo(geo) {
    if (geo.userData.smooth) return geo.userData.smooth;
    const g = geo.clone();
    if (!g.attributes.normal) g.computeVertexNormals();
    const p = g.attributes.position, n = g.attributes.normal, acc = new Map(), key = i => `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
    for (let i = 0; i < p.count; i++) { const k = key(i), a = acc.get(k) || [0, 0, 0]; a[0] += n.getX(i); a[1] += n.getY(i); a[2] += n.getZ(i); acc.set(k, a); }
    const out = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) { const a = acc.get(key(i)), l = Math.hypot(a[0], a[1], a[2]) || 1; out[i * 3] = a[0] / l; out[i * 3 + 1] = a[1] / l; out[i * 3 + 2] = a[2] / l; }
    g.setAttribute('normal', new THREE.BufferAttribute(out, 3));
    return (geo.userData.smooth = g);
  }
  const outlines = [];
  function addOutline(m, k) {
    const mat = outlineMat(m.isSkinnedMesh, k), g = smoothGeo(m.geometry);
    let o;
    if (m.isSkinnedMesh) { o = new THREE.SkinnedMesh(g, mat); o.bind(m.skeleton, m.bindMatrix); }
    else o = new THREE.Mesh(g, mat);
    o.position.copy(m.position); o.quaternion.copy(m.quaternion); o.scale.copy(m.scale);
    o.castShadow = false; o.frustumCulled = false; m.parent.add(o); outlines.push(o);
    return o;
  }
  function mk(geo, color, x, y, z, parent, o) {
    o = o || {};
    const m = new THREE.Mesh(geo, o.mat || T(color, o.m));
    m.position.set(x || 0, y || 0, z || 0); m.castShadow = o.shadow !== false; m.receiveShadow = true;
    (parent || scene).add(m);
    if (o.outline !== false) addOutline(m, o.k);
    return m;
  }
  const grp = (x, y, z, p) => { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); (p || scene).add(g); return g; };
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cyl = (a, b, h, s) => new THREE.CylinderGeometry(a, b, h, s || 8);
  const cone = (r, h, s) => new THREE.ConeGeometry(r, h, s || 6);
  const ico = (r, d) => new THREE.IcosahedronGeometry(r, d || 0);
  function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }

  // Turn a loaded model into the toon look: flat 3-tone shading, original colors, an ink outline.
  // Recolour a palette texture: rotate the hue of everything except skin tones and greys.
  const recolCache = new Map();
  function recolor(map, hue, sat) {
    const key = map.uuid + ':' + hue + ':' + sat;
    if (recolCache.has(key)) return recolCache.get(key);
    const img = map.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      const col = new THREE.Color(px[i] / 255, px[i + 1] / 255, px[i + 2] / 255), hsl = {}; col.getHSL(hsl);
      const skin = hsl.h > 0.02 && hsl.h < 0.12 && hsl.s > 0.2 && hsl.s < 0.8 && hsl.l > 0.35 && hsl.l < 0.85;
      if (skin || hsl.s < 0.12) continue;
      col.setHSL((hsl.h + hue / 360 + 1) % 1, Math.min(1, hsl.s * (sat || 1)), hsl.l);
      px[i] = col.r * 255; px[i + 1] = col.g * 255; px[i + 2] = col.b * 255;
    }
    g.putImageData(d, 0, 0);
    const t = new THREE.CanvasTexture(c); t.flipY = map.flipY; t.wrapS = map.wrapS; t.wrapT = map.wrapT; t.magFilter = map.magFilter; t.minFilter = map.minFilter;
    recolCache.set(key, t); return t;
  }
  const WEAPON = /weapon|sword|axe|cutlass|pistol|rifle|knife|dagger|gun/i;
  function toonify(root, o) {
    o = o || {};
    const drop = []; root.traverse(n => { if (n.name && WEAPON.test(n.name) && !n.isBone) drop.push(n); });
    drop.forEach(n => n.parent && n.parent.remove(n)); // our guests come to eat, not to fight
    const meshes = []; root.traverse(m => { if (m.isMesh) meshes.push(m); });
    meshes.forEach(m => {
      const conv = mm => {
        const t = new THREE.MeshToonMaterial({ color: mm.color ? mm.color.clone() : new THREE.Color(0xffffff), map: mm.map || null, gradientMap: ramp, vertexColors: !!mm.vertexColors, transparent: !!mm.transparent, opacity: mm.opacity === undefined ? 1 : mm.opacity });
        if (o.gltf && mm.color) t.color.convertLinearToSRGB(); // keep glTF colours as bright as they were authored
        t.skinning = !!m.isSkinnedMesh;
        if (t.map && o.hue !== undefined) t.map = recolor(t.map, o.hue, o.sat);
        if (t.map) { t.map.encoding = THREE.LinearEncoding; t.map.needsUpdate = true; }
        if (o.mats && mm.name && o.mats[mm.name] !== undefined) t.color.set(o.mats[mm.name]);
        if (o.tint) t.color.multiply(new THREE.Color(o.tint));
        if (o.bright) t.color.multiplyScalar(o.bright);
        return t;
      };
      m.material = Array.isArray(m.material) ? m.material.map(conv) : conv(m.material);
      m.castShadow = o.shadow !== false; m.receiveShadow = true;
      if (o.outline !== false) addOutline(m, o.k);
    });
    return root;
  }
  // Wrap a model so it stands on y = 0, is `h` tall, and is centred.
  function fit(obj, h, by) {
    const wrap = new THREE.Group(); wrap.add(obj); obj.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(obj), sz = b.getSize(new THREE.Vector3());
    const s = h / (by === 'w' ? Math.max(sz.x, sz.z) : sz.y);
    obj.scale.multiplyScalar(s);
    obj.position.set(-(b.min.x + sz.x / 2) * s, -b.min.y * s, -(b.min.z + sz.z / 2) * s);
    return wrap;
  }

  // ================= loading =================
  const ASSETS = {
    glb: ['captain', 'anne', 'sharky', 'crab', 'fishfolk', 'chefhat', 'coin', 'barrel', 'bucket_fishes', 'anchor', 'chest_gold', 'palmtree_1', 'palmtree_2', 'palmtree_3', 'rock_1', 'rock_2', 'dock',
      'table', 'stool', 'light', 'pot_1_filled', 'oven', 'counter_straight', 'plate', 'salmonnigiri', 'ramen', 'onigiri', 'maguronigiri', 'plant1',
      'fish_clownfish', 'fish_puffer', 'fish_tuna', 'fish_koi', 'fish_bluetang', 'food_fish', 'food_steak']
  };
  const total = ASSETS.glb.length; let loaded = 0;
  const tick = () => { loaded++; $('lfill').style.width = (loaded / total * 100) + '%'; $('ltext').textContent = `Loading the crew · ${loaded}/${total}`; };
  const M = {};
  const gl = new THREE.GLTFLoader();
  const loadGLB = n => new Promise(res => gl.load(`models/${n}.json`, g => { M[n] = g; tick(); res(); }, undefined, e => { console.warn('model failed', n, e); tick(); res(); }));
  // a fresh copy of a static model (characters are only used once, so they are not cloned)
  const copy = n => M[n] ? M[n].scene.clone(true) : new THREE.Group();

  Promise.all(ASSETS.glb.map(loadGLB)).then(() => { try { build(); } catch (e) { console.error('BUILD', e.message, e.stack.split('\n').slice(0, 4).join(' | ')); } });

  // ================= light =================
  const hemi = new THREE.HemisphereLight(0xffffff, 0x9fd6e8, 0.75); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(18, 30, 12);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0008;
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 90 });
  scene.add(sun);

  // ================= faceted cartoon sea =================
  const seaU = { uT: { value: 0 }, uDeep: { value: new THREE.Color(0x158fd1) }, uMid: { value: new THREE.Color(0x26b4e6) }, uLite: { value: new THREE.Color(0x5fdcf0) }, uFoam: { value: new THREE.Color(0xffffff) } };
  const seaMat = new THREE.ShaderMaterial({
    uniforms: seaU, extensions: { derivatives: true },
    vertexShader: `uniform float uT; varying vec3 vP;
      float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){ vec4 w = modelMatrix * vec4(position,1.0);
        float j = h(floor(position.xz*10.0)) * 6.28;
        w.y += sin(w.x*0.22 + uT*1.1 + j*0.3)*0.35 + cos(w.z*0.19 + uT*0.9)*0.3 + sin(uT*1.7 + j)*0.12;
        vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float uT; uniform vec3 uDeep, uMid, uLite, uFoam; varying vec3 vP;
      void main(){
        vec3 n = normalize(cross(dFdx(vP), dFdy(vP))); if (n.y < 0.0) n = -n;
        float l = dot(n, normalize(vec3(0.45, 1.0, 0.25)));
        vec3 col = l > 0.93 ? uLite : (l > 0.85 ? uMid : uDeep);
        vec2 b = vec2(vP.x/6.0, (vP.z-1.2)/15.4); float d = length(b), a = atan(b.y, b.x);
        float edge = 1.0 + 0.04*sin(a*12.0 + uT*3.0);
        col = mix(col, uFoam, step(d, edge + 0.065) * step(edge - 0.02, d));
        float r2 = 1.18 + 0.03*sin(a*8.0 - uT*2.0);
        col = mix(col, mix(col, uFoam, 0.55), step(abs(d - r2), 0.02));
        float far = smoothstep(80.0, 170.0, length(vP.xz));
        gl_FragColor = vec4(mix(col, uLite*1.08, far), 1.0);
      }`
  });
  const seaGeo = new THREE.PlaneGeometry(360, 360, 90, 90); seaGeo.rotateX(-Math.PI / 2);
  scene.add(new THREE.Mesh(seaGeo, seaMat));
  const waveY = (x, z, t) => Math.sin(x * 0.22 + t * 1.1) * 0.35 + Math.cos(z * 0.19 + t * 0.9) * 0.3;

  // ================= the boat hull (ours: the restaurant is its own boat) =================
  const boat = grp();
  const DECK = 1.62, BOW = -12.5, STERN = 15;

      el.innerHTML = `<span class="who">${KIND[s.kind].name}</span><img src="${d.src}" alt=""><span>${d.name}</span>`;
      rail.appendChild(el);
    });
  }
  function addCash(n) { cash += n; $('cash').textContent = '$' + cash; const c = document.querySelector('.coin'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
  function serve(s) {
    const pay = DISHES[s.dish].price, tip = s.patience > 0.6 ? Math.round(pay * 0.5) : 0;
    burst(s.g, 6 + (tip ? 4 : 0));
    pop(s.g, '+$' + (pay + tip), s.patience > 0.6 ? 'big' : '');
    if (tip) setTimeout(() => pop(s.g, s.patience > 0.85 ? 'PERFECT!' : 'TIP!', 'heart', 4.8), 220);
    setTimeout(() => addCash(pay + tip), 450);
    servePlate(s); s.eatT = 3;
    s.g.userData.play(KIND[s.kind].happy, true); s.mad = false;
    s.patience = 1; s.dish = pick(KIND[s.kind].dishes);
    drawRail(s);
  }
  $('serve').addEventListener('click', () => { if (seats.length) serve(seats.reduce((a, b) => (b.patience < a.patience ? b : a))); });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); $('serve').click(); } });

  // ================= camera =================
  let yaw = Math.PI - 0.75, pitch = 0.5, dist = 28, auto = true;
  const target = new THREE.Vector3(0, 2.4, -1);
  const ptrs = new Map(); let pinch = 0;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); auto = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const [px, py] = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) { yaw -= (e.clientX - px) * 0.006; pitch = Math.min(1.25, Math.max(0.15, pitch + (e.clientY - py) * 0.004)); }
    else { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) dist = Math.min(70, Math.max(10, dist * pinch / d)); pinch = d; }
  });
  const up = e => { ptrs.delete(e.pointerId); pinch = 0; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.min(70, Math.max(10, dist * (1 + Math.sign(e.deltaY) * 0.08))); auto = false; }, { passive: false });

  // ================= day / sunset, outlines =================
  const looks = {
    day: { deep: 0x158fd1, mid: 0x26b4e6, lite: 0x5fdcf0, hemi: 0.75, sun: 0.8, sunC: 0xffffff },
    sunset: { deep: 0x3a3fa8, mid: 0x5a5ad0, lite: 0xb07ad8, hemi: 0.45, sun: 0.75, sunC: 0xffa860 }
  };
  let look = 'day';
  function setLook(k) {
    look = k; const L = looks[k];
    seaU.uDeep.value.set(L.deep); seaU.uMid.value.set(L.mid); seaU.uLite.value.set(L.lite);
    hemi.intensity = L.hemi; sun.intensity = L.sun; sun.color.set(L.sunC);
    document.body.classList.toggle('sunset', k === 'sunset');
    $('tTime').textContent = k === 'day' ? 'Sunset' : 'Daytime';
  }
  $('tTime').addEventListener('click', () => setLook(look === 'day' ? 'sunset' : 'day'));
  let lines = true;
  $('tOutline').addEventListener('click', () => { lines = !lines; outlines.forEach(o => { o.visible = lines; }); $('tOutline').textContent = 'Outlines: ' + (lines ? 'on' : 'off'); });

  // ================= loop =================
  const clock = new THREE.Clock(); let t = 0, railT = 0;
  function frame() {
    const dt = Math.min(0.05, clock.getDelta()); t += reduce ? dt * 0.3 : dt;
    seaU.uT.value = t;
    boat.position.y = waveY(0, 1, t) * 0.6; boat.rotation.z = Math.sin(t * 0.9) * 0.025; boat.rotation.x = Math.cos(t * 0.7) * 0.015;
    anims.forEach(m => m.update(dt));
    heads.forEach(([b, k]) => b.scale.setScalar(k));
    squids.forEach(q => q.userData.update(dt, t));
    if (chef) { const w = Math.sin(t * 0.32); chef.position.set(3.0, DECK + 0.1, -1 + w * 7); chef.rotation.y = Math.cos(t * 0.32) > 0 ? 0 : Math.PI; }
    if (built) seats.forEach(s => {
      s.patience = Math.max(0, s.patience - dt * s.rate);
      if (s.patience < 0.3 && !s.mad) { s.mad = true; s.g.userData.play(KIND[s.kind].mad, true); }
      if (s.patience === 0) { pop(s.g, 'HMPH!', 'mad'); s.g.userData.play(KIND[s.kind].mad, true); s.patience = 1; s.mad = false; s.dish = pick(KIND[s.kind].dishes); drawRail(s); }
      if (s.eatT > 0) { s.eatT -= dt; if (s.eatT <= 0) s.plate.visible = false; }
      const p = toScreen(s.g, 3.6);
      if (p) {
        s.el.hidden = false; s.el.style.left = p[0] + 'px'; s.el.style.top = p[1] + 'px';
        const img = s.el.querySelector('img'); if (img.dataset.d !== s.dish) { img.src = DISHES[s.dish].src; img.dataset.d = s.dish; }
        const bar = s.el.querySelector('i'); bar.style.width = (s.patience * 100) + '%'; bar.style.background = s.patience > 0.6 ? '#3fd08a' : s.patience > 0.3 ? '#ffd23c' : '#ff5d5d';
      } else s.el.hidden = true;
    });
    railT -= dt; if (railT <= 0 && built) { drawRail(); railT = 0.5; }
    flag.rotation.y = Math.sin(t * 3) * 0.25;
    clouds.forEach((c, i) => { c.position.x += dt * (0.6 + i * 0.1); if (c.position.x > 140) c.position.x = -140; });
    gull.position.set(Math.cos(t * 0.3) * 22, 12 + Math.sin(t) * 0.6, Math.sin(t * 0.3) * 22 + 1); gull.rotation.y = -t * 0.3; gull.rotation.z = 0.25;
    gw.forEach((g, k) => { g.rotation.z = (k ? -1 : 1) * Math.sin(t * 8) * 0.5; });
    nextJump -= dt;
    if (jumpers.length && !jump && nextJump <= 0) { const a = rnd(0, Math.PI * 2), r = rnd(11, 16); jump = { f: pick(jumpers), x: Math.cos(a) * r, z: Math.sin(a) * r + 1, dir: a + Math.PI / 2, u: 0 }; jump.f.visible = true; splash(jump.x, jump.z); }
    if (jump) {
      jump.u += dt / 1.2; const u = jump.u, f = jump.f;
      f.position.set(jump.x + Math.cos(jump.dir) * 4 * u, Math.sin(u * Math.PI) * 4 - 0.5, jump.z + Math.sin(jump.dir) * 4 * u);
      f.rotation.set(0, -jump.dir + Math.PI / 2, 0); f.rotateX(-Math.cos(u * Math.PI) * 1.0);
      if (u >= 1) { splash(f.position.x, f.position.z); f.visible = false; jump = null; nextJump = rnd(2.5, 4.5); }
    }
    for (let i = splashes.length - 1; i >= 0; i--) { const s = splashes[i]; s.t += dt; s.r.scale.setScalar(0.4 + s.t * 2.2); s.r.material.opacity = 1 - s.t / 0.8; if (s.t > 0.8) { scene.remove(s.r); splashes.splice(i, 1); } }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i]; c.t += dt; c.vy -= 18 * dt;
      c.c.position.x += c.vx * dt; c.c.position.y += c.vy * dt; c.c.position.z += c.vz * dt; c.c.rotation.y += c.s * dt;
      if (c.t > 1.1) { scene.remove(c.c); coins.splice(i, 1); }
    }
    if (auto && !reduce) yaw += dt * 0.06;
    camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(target);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
  window.__serve = () => $('serve').click();
  window.__cam = (d, y, p, tx, tz) => { dist = d; yaw = y; pitch = p; auto = false; if (tx !== undefined) { target.x = tx; target.z = tz; } };
  window.__chef = () => chef && chef.getWorldPosition(new THREE.Vector3()).toArray();
})();
</script>
