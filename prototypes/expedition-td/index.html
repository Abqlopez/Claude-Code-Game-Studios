<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedition TD</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f17; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; cursor: crosshair; }
</style>

<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = 'Georgia, "Times New Roman", serif';
const TITLE = 'Expedition TD';
const CONTROLS = [
  'Mouse: aim and click    1-4: pick hero / Archer / Shield / Support',
  'Click or Enter: place    Arrows: move the cursor    Esc / right-click: cancel',
  'Click a person, then U / I: upgrade path A / B    X: sell',
  'Q: hero strike    Space: next wave    F: speed    P: pause    M: mute',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = false) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
const mouse = { x: 780, y: 330 };
const clicks = []; // processed on the step, so a run replays the same
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointermove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; });
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  clicks.push({ x: p.x, y: p.y, right: e.button === 2 });
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- Audio ------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  shot: () => tone(880, 0.05, 'triangle', 0.08, 0.6),
  hit: () => tone(220, 0.05, 'square', 0.05, 0.5),
  place: () => { tone(330, 0.08, 'triangle', 0.2); tone(495, 0.12, 'triangle', 0.15); },
  wave: () => { tone(196, 0.3, 'sawtooth', 0.12); tone(294, 0.4, 'sawtooth', 0.1); },
  rumble: () => tone(55, 0.6, 'sawtooth', 0.25, 0.7),
  slam: () => tone(70, 0.5, 'square', 0.35, 0.3),
  windup: () => tone(110, 0.5, 'sawtooth', 0.12, 2.2),
  gate: () => tone(140, 0.15, 'square', 0.2, 0.5),
  down: () => tone(300, 0.4, 'triangle', 0.2, 0.3),
  up: () => tone(400, 0.25, 'triangle', 0.18, 1.6),
  strike: () => { tone(160, 0.3, 'square', 0.25, 0.4); tone(640, 0.2, 'triangle', 0.15, 0.5); },
  gold: () => tone(1046, 0.08, 'triangle', 0.1),
  level: () => { tone(523, 0.1, 'triangle', 0.15); tone(784, 0.18, 'triangle', 0.15); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3 + i * 0.1, 'triangle', 0.18)),
  lose: () => tone(200, 1.2, 'sawtooth', 0.2, 0.25),
  deny: () => tone(120, 0.12, 'square', 0.12),
};

// ---- The map ----------------------------------------------------------------------------
const TOP = 48, BOTTOM = 628; // the playfield between the HUD bars
const ROAD = [[-40, 250], [150, 250], [255, 320], [262, 470], [410, 540], [600, 522], [700, 430],
  [700, 300], [820, 228], [960, 262], [1025, 380], [1132, 400]];
const RIVER = [[565, TOP], [548, 200], [522, 360], [516, 500], [505, 560], [495, BOTTOM]];
const RIVER_W = 48;
const CLIFF = [[290, TOP], [500, TOP], [478, 118], [420, 186], [330, 172], [286, 104]];
const HILLS = [{ x: 880, y: 118, rx: 112, ry: 50 }, { x: 115, y: 432, rx: 88, ry: 46 }];
const MUD = { x: 700, y: 365, rx: 52, ry: 78 };
const GATE = { x: 1140, y: 400 };
const BUILDINGS = [ // x, y is the front of the base; w, d footprint; h height
  { x: 1215, y: 150, w: 70, d: 40, h: 46, roof: '#8a3b2c' }, { x: 1200, y: 285, w: 64, d: 36, h: 40, roof: '#6d4a2e' },
  { x: 1225, y: 520, w: 70, d: 40, h: 46, roof: '#8a3b2c' }, { x: 1195, y: 620, w: 60, d: 34, h: 38, roof: '#6d4a2e' },
  { x: 990, y: 128, w: 56, d: 32, h: 36, roof: '#7b4a33' }, { x: 66, y: 600, w: 66, d: 36, h: 40, roof: '#9a6a2c' },
];
const VILLAGER_PATH = [[100, 612], [260, 604], [410, 566], [505, 548], [600, 545], [800, 600], [1000, 585], [1132, 430]];

function makePath(pts) {
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], len = Math.hypot(bx - ax, by - ay);
    segs.push({ ax, ay, bx, by, len, start: total }); total += len;
  }
  return { segs, total };
}
const road = makePath(ROAD), vpath = makePath(VILLAGER_PATH), river = makePath(RIVER);
function posAt(p, d) {
  d = Math.max(0, Math.min(p.total, d));
  for (const s of p.segs) if (d <= s.start + s.len) {
    const k = (d - s.start) / s.len;
    return { x: s.ax + (s.bx - s.ax) * k, y: s.ay + (s.by - s.ay) * k, dx: s.bx - s.ax, dy: s.by - s.ay };
  }
  const s = p.segs[p.segs.length - 1]; return { x: s.bx, y: s.by, dx: 1, dy: 0 };
}
function nearestOn(p, x, y) { // { dist, d }
  let best = { dist: Infinity, d: 0 };
  for (const s of p.segs) {
    const vx = s.bx - s.ax, vy = s.by - s.ay;
    const k = Math.max(0, Math.min(1, ((x - s.ax) * vx + (y - s.ay) * vy) / (s.len * s.len)));
    const px = s.ax + vx * k, py = s.ay + vy * k, dist = Math.hypot(x - px, y - py);
    if (dist < best.dist) best = { dist, d: s.start + k * s.len };
  }
  return best;
}
function inPoly(poly, x, y) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const inEll = (e, x, y, pad = 1) => ((x - e.x) / (e.rx * pad)) ** 2 + ((y - e.y) / (e.ry * pad)) ** 2 <= 1;
const onHill = (x, y) => HILLS.some(h => inEll(h, x, y));
const inMud = (x, y) => inEll(MUD, x, y);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function spotProblem(x, y, ignore) {
  if (x < 18 || x > 1118 || y < TOP + 22 || y > BOTTOM - 8) return 'out of bounds';
  if (nearestOn(river, x, y).dist < RIVER_W / 2 + 6) return 'blocked: deep water';
  if (inPoly(CLIFF, x, y)) return 'blocked: cliffs';
  for (const b of BUILDINGS) if (Math.abs(x - b.x) < b.w / 2 + 8 && y < b.y + 10 && y > b.y - b.d - 30) return 'blocked: inside a building';
  if (nearestOn(road, x, y).dist < 30) return 'blocked: the road';
  if (propBlocked(x, y)) return 'blocked: tree or rock';
  if (nearestOn(vpath, x, y).dist < 14) return 'blocked: the villagers\' path';
  for (const u of state.units) if (u !== ignore && Math.hypot(u.x - x, u.y - y) < 36) return 'too close to someone';
  return null;
}

// ---- Units ------------------------------------------------------------------------------
const KINDS = {
  mc: { name: 'Hero', role: 'Main tower' },
  archer: { name: 'Archer', role: 'Damage', paths: ['Rapid', 'Precision'],
    tiers: [['Faster shots', 'Double arrow', 'Triple arrow', 'Arrow storm'], ['More range', 'Piercing', 'Critical hits', 'Sniper shot']] },
  shield: { name: 'Shield Fighter', role: 'Control', paths: ['Wall', 'Bash'],
    tiers: [['Blocks more', 'More HP', 'Taunt', 'Unbreakable'], ['Stuns', 'Knockback', 'Ground slam', 'Shockwave']] },
  support: { name: 'Support', role: 'Support', paths: ['Healing', 'Inspire'],
    tiers: [['Faster heals', 'Area heal', 'Faster revives', 'Mass heal'], ['Attack speed aura', 'More range', 'Gold bonus', 'Rally']] },
};
const costOf = k => k === 'mc' ? 0 : tune['cost_' + k];
const upCost = t => tune['upgrade_t' + (t + 1)];
function canUp(u, p) { // 2 paths x 4 tiers: tier 4 in one, only tier 2 in the other
  const next = (p === 0 ? u.a : u.b) + 1, other = p === 0 ? u.b : u.a;
  return next <= 4 && !(next > 2 && other > 2);
}
function capReason(u, p) {
  const mine = p === 0 ? u.a : u.b;
  if (mine >= 4) return 'maxed';
  return 'locked: other path past tier 2';
}

function inspireMul(u) { // attack-rate multiplier from Inspire supports and Rally
  let m = 1;
  for (const s of state.units) {
    if (s.kind !== 'support' || s.down > 0 || s === u) continue;
    const r = stats(s).range;
    if (Math.hypot(s.x - u.x, s.y - u.y) > r) continue;
    if (s.b >= 1) m += 0.2;
    if (s.rallyT > 0) m += 0.6;
  }
  return m;
}
function stats(u) {
  const hg = u.high ? 1 + tune.high_ground_range : 1;
  if (u.kind === 'mc') {
    const lv = 1 + tune.mc_level_bonus * (state.mcLevel - 1);
    return { range: tune.mc_range * hg, dmg: tune.mc_damage * lv, rate: tune.mc_rate * lv, maxhp: tune.mc_hp };
  }
  if (u.kind === 'archer') return {
    range: tune.archer_range * hg * (u.b >= 1 ? 1.25 : 1), dmg: tune.archer_damage,
    rate: tune.archer_rate * (u.a >= 1 ? 1.35 : 1), maxhp: tune.archer_hp,
    shots: u.a >= 3 ? 3 : u.a >= 2 ? 2 : 1, pierce: u.b >= 2, crit: u.b >= 3,
  };
  if (u.kind === 'shield') return {
    range: tune.shield_range * hg, dmg: tune.shield_damage, rate: tune.shield_rate,
    maxhp: tune.shield_hp * (u.a >= 2 ? 1.5 : 1), block: tune.shield_block + (u.a >= 1 ? 1 : 0),
    taunt: u.a >= 3, stun: u.b >= 1, knock: u.b >= 2,
  };
  return {
    range: tune.support_range * hg * (u.b >= 2 ? 1.3 : 1), heal: tune.support_heal,
    rate: tune.support_rate * (u.a >= 1 ? 1.6 : 1), maxhp: tune.support_hp, area: u.a >= 2,
  };
}
function addUnit(kind, x, y) {
  const u = { id: ++state.nextId, kind, x, y, a: 0, b: 0, cd: 0.3, abil: 6, down: 0, spent: costOf(kind),
    high: onHill(x, y), rallyT: 0, unbreakT: 0, unbreakCd: 0, engaged: 0, flash: 0, face: 1, anim: rng() * 6 };
  u.hp = stats(u).maxhp; state.units.push(u); return u;
}
function hurtUnit(u, dmg) {
  if (u.down > 0 || u.unbreakT > 0) return;
  const st = stats(u);
  if (u.kind === 'shield' && u.a >= 4 && u.unbreakCd <= 0 && (u.hp - dmg) < st.maxhp * 0.3) {
    u.unbreakT = 5; u.unbreakCd = 30; fx({ type: 'text', x: u.x, y: u.y - 60, s: 'Unbreakable!', c: '#ffe28a', t: 1.2 }); return;
  }
  u.hp -= dmg; u.flash = 0.12;
  if (u.hp <= 0) {
    u.hp = 0; u.down = u.kind === 'mc' ? tune.mc_down_time : tune.companion_down_time; u.downMax = u.down;
    sfx.down(); fx({ type: 'text', x: u.x, y: u.y - 50, s: u.kind === 'mc' ? 'Hero downed!' : KINDS[u.kind].name + ' downed', c: '#ff8a7a', t: 1.4 });
    events.push({ type: 'downed', kind: u.kind });
  }
}

// ---- Enemies ----------------------------------------------------------------------------
const ENEMY = {
  walker: { name: 'Walker', r: 14 }, swarm: { name: 'Swarm', r: 7 },
  burrower: { name: 'Burrower', r: 15 }, alpha: { name: 'Alpha', r: 34 },
};
function spawn(kind) {
  const grow = 1 + tune.enemy_hp_growth * (state.wave - 1);
  const hp = tune[kind + '_hp'] * grow;
  const e = { kind, d: 0, x: ROAD[0][0], y: ROAD[0][1], hp, maxhp: hp, off: (rng() - 0.5) * 14,
    stun: 0, blockedBy: null, mode: 'walk', t: 0, face: 1, anim: rng() * 6, flash: 0, slamCd: 3, target: null };
  if (kind === 'burrower') {
    e.mode = 'tell'; e.t = tune.burrower_tell; sfx.rumble();
    const tgt = burrowTarget();
    if (tgt) { e.target = tgt; e.x = tgt.x + (rng() - 0.5) * 40; e.y = tgt.y + 26; }
    else { const p = posAt(road, road.total * 0.7); e.x = p.x; e.y = p.y; }
  }
  state.enemies.push(e); return e;
}
function spawnSwarm(n) {
  for (let i = 0; i < n; i++) {
    const e = spawn('swarm'); e.mode = 'gather'; e.t = tune.swarm_gather + i * 0.06;
    e.x = 14 + rng() * 46; e.y = 230 + rng() * 40;
  }
}
function burrowTarget() { // the back line: the person standing nearest the gate, unless a taunt is close
  const alive = state.units.filter(u => u.down <= 0);
  if (!alive.length) return null;
  let back = alive[0];
  for (const u of alive) if (dist(u, GATE) < dist(back, GATE)) back = u;
  for (const u of alive) if (u.kind === 'shield' && stats(u).taunt && dist(u, back) < 170) return u;
  return back;
}
function hurtEnemy(e, dmg, crit = false) {
  if (e.hp <= 0 || e.mode === 'tell' || e.mode === 'under') return;
  e.hp -= dmg; e.flash = 0.08;
  if (crit) fx({ type: 'text', x: e.x, y: e.y - 30, s: 'crit!', c: '#ffd75a', t: 0.6 });
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  const g = tune['bounty_' + e.kind];
  state.gold += g; state.kills++;
  addXp(g);
  fx({ type: 'text', x: e.x, y: e.y - 20, s: '+' + g, c: '#ffd75a', t: 0.8 });
  fx({ type: 'puff', x: e.x, y: e.y, t: 0.4, r: ENEMY[e.kind].r * 1.6 });
  events.push({ type: 'kill', kind: e.kind });
}
function addXp(x) {
  if (state.mcLevel >= tune.mc_max_level) return;
  state.mcXp += x;
  while (state.mcXp >= tune.mc_xp_level && state.mcLevel < tune.mc_max_level) {
    state.mcXp -= tune.mc_xp_level; state.mcLevel++;
    const mc = state.units.find(u => u.kind === 'mc');
    if (mc) fx({ type: 'text', x: mc.x, y: mc.y - 70, s: 'Level ' + state.mcLevel, c: '#9ee7ff', t: 1.4 });
    sfx.level();
  }
}

// ---- Effects ----------------------------------------------------------------------------
function fx(f) { f.max = f.t; state.fx.push(f); }

// ---- State and waves --------------------------------------------------------------------
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = {
    t: 0, score: 0, gained: '', gold: tune.start_gold, gate: tune.gate_hp, wave: 0, phase: 'build',
    units: [], enemies: [], shots: [], fx: [], villagers: [], queue: [], waveT: 0,
    placing: 'mc', selected: null, nextId: 0, mcLevel: 1, mcXp: 0, strikeCd: 0, speed: 1,
    msg: '', msgT: 0, kills: 0, saved: 0, lost: 0, shake: 0, won: false,
  };
  mouse.x = 780; mouse.y = 330;
}
function say(s, t = 2.2) { state.msg = s; state.msgT = t; }
function startWave() {
  if (state.phase !== 'build' || state.wave >= CONFIG.waves.length) return;
  if (!state.units.some(u => u.kind === 'mc')) { say('Place your hero first: it is free.'); sfx.deny(); return; }
  state.wave++; state.phase = 'wave'; state.waveT = 0; state.queue = [];
  const w = CONFIG.waves[state.wave - 1];
  for (const g of w.groups) {
    if (g.kind === 'swarm') state.queue.push({ t: g.delay, kind: 'swarm', n: g.count });
    else for (let i = 0; i < g.count; i++) state.queue.push({ t: g.delay + i * (g.gap || 1), kind: g.kind });
  }
  if (w.villagers) for (let i = 0; i < tune.villagers_per_wave; i++) state.queue.push({ t: 2 + i * 1.6, kind: 'villager' });
  state.queue.sort((a, b) => a.t - b.t);
  sfx.wave(); events.push({ type: 'wave', n: state.wave });
  if (w.villagers) say('Villagers are fleeing to the gate: keep the road clear to save them (+' + tune.villager_gold + ' each).', 4);
}
function endWave() {
  const bonus = tune.wave_clear_base + tune.wave_clear_per_wave * state.wave
    + state.units.filter(u => u.kind === 'support' && u.b >= 3).length * 15;
  state.gold += bonus; state.phase = 'build'; sfx.gold();
  for (const u of state.units) { if (u.down > 0) { u.down = 0; u.hp = stats(u).maxhp * 0.5; } }
  if (state.wave >= CONFIG.waves.length) {
    state.won = true; state.gained = 'The village stands!'; scene = 'results'; sfx.win(); events.push({ type: 'win' });
    return;
  }
  say(`Wave ${state.wave} cleared: +${bonus} gold. Space for wave ${state.wave + 1}.`, 3.5);
}

// ---- Simulation -------------------------------------------------------------------------
function trySelectOrPlace(x, y) {
  if (y > BOTTOM) { panelClick(x, y); return; }
  if (state.placing) { placeAt(x, y); return; }
  let best = null;
  for (const u of state.units) if (Math.hypot(u.x - x, u.y - 14 - y) < 30 && (!best || Math.hypot(u.x - x, u.y - y) < Math.hypot(best.x - x, best.y - y))) best = u;
  state.selected = best;
}
function choose(kind) {
  if (kind !== 'mc' && !state.units.some(u => u.kind === 'mc')) { say('Place your hero first: it is free.'); sfx.deny(); return; }
  if (kind === 'mc' && state.units.some(u => u.kind === 'mc')) { state.selected = state.units.find(u => u.kind === 'mc'); return; }
  if (state.gold < costOf(kind)) { say(`Not enough gold for the ${KINDS[kind].name} (${costOf(kind)}).`); sfx.deny(); return; }
  state.placing = kind; state.selected = null;
}
function placeAt(x, y) {
  const k = state.placing, p = spotProblem(x, y);
  if (p) { say(p); sfx.deny(); return; }
  if (state.gold < costOf(k)) { say('Not enough gold.'); sfx.deny(); state.placing = null; return; }
  state.gold -= costOf(k);
  const u = addUnit(k, x, y); sfx.place(); events.push({ type: 'place', kind: k });
  fx({ type: 'ring', x, y, r: 30, t: 0.4, c: '#fff' });
  state.placing = null; state.selected = u;
  if (k === 'mc') say('Hero placed. Buy a companion (2-4), then Space to start wave 1.', 4);
}
function upgrade(p) {
  const u = state.selected; if (!u || u.kind === 'mc') return;
  if (!canUp(u, p)) { say(capReason(u, p)); sfx.deny(); return; }
  const tier = p === 0 ? u.a : u.b, c = upCost(tier);
  if (state.gold < c) { say(`Need ${c} gold.`); sfx.deny(); return; }
  const before = stats(u).maxhp;

    text(Math.ceil(u.down) + '', u.x, u.y - 40, 13, '#fff', 'center', true);
  } else if (u.hp < st.maxhp) hpBar(u.x, u.y - (u.kind === 'mc' ? 74 : 64), u.hp / st.maxhp, 30, '#6ad04a');
  if (u.kind === 'mc') text('Lv ' + state.mcLevel, u.x, u.y + 14, 13, '#9ee7ff', 'center', true);
  else if (u.a + u.b > 0) text(`${u.a}-${u.b}`, u.x, u.y + 14, 13, '#fff', 'center', true);
}
function drawFoe(e) {
  if (e.mode === 'gather') { ctx.globalAlpha = 0.9; }
  drawEnemy(e.kind, e.x, e.y, e.face, e.anim, { flash: e.flash > 0 });
  ctx.globalAlpha = 1;
  if (e.stun > 0) text('*', e.x, e.y - ENEMY[e.kind].r * 2 - 14, 18, '#ffe28a', 'center', true);
  if (e.hp < e.maxhp) hpBar(e.x, e.y - (e.kind === 'alpha' ? 116 : ENEMY[e.kind].r * 2 + 8), e.hp / e.maxhp, e.kind === 'alpha' ? 70 : 26, '#e05a4a');
}
// a view-only random for screen shake, so drawing never moves the gameplay rng
rng.view = (() => { let v = 99; return () => (v = (v * 16807) % 2147483647) / 2147483647; })();

// ---- HUD --------------------------------------------------------------------------------
function panelBox(r, on, hot) {
  ctx.fillStyle = on ? (hot ? '#5a4628' : '#3e3122') : '#2a241c'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = on ? '#c9a46a' : '#5a4a36'; ctx.lineWidth = 2; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
}
function drawHUD() {
  ctx.fillStyle = '#2a2118'; ctx.fillRect(0, 0, W, TOP);
  ctx.fillStyle = '#c9a46a'; ctx.fillRect(0, TOP - 3, W, 3);
  text(`Gold ${Math.floor(state.gold)}`, 20, 24, 22, '#ffd75a', 'left', true);
  text(`Gate ${Math.ceil(state.gate)} / ${tune.gate_hp}`, 200, 24, 22, state.gate > tune.gate_hp * 0.3 ? '#f2ead2' : '#ff8a7a', 'left', true);
  text(`Wave ${state.wave} / ${CONFIG.waves.length}`, 420, 24, 22, '#f2ead2', 'left', true);
  text(`Hero Lv ${state.mcLevel}`, 590, 24, 20, '#9ee7ff', 'left', true);
  if (state.saved + state.lost) text(`Villagers saved ${state.saved}, lost ${state.lost}`, 740, 24, 17, '#d8c49a', 'left');
  text(state.speed > 1 ? 'Speed x2 (F)' : 'Speed x1 (F)', 1260, 24, 17, '#c9b48a', 'right');
  // the message line
  let m = '';
  if (state.msgT > 0) m = state.msg;
  else if (!state.units.some(u => u.kind === 'mc')) m = 'Place your hero: move the mouse onto open ground and click. It is free.';
  else if (state.phase === 'build') m = `Build phase. Space: start wave ${state.wave + 1}.`;
  if (m) {
    ctx.font = `bold 17px ${FONT}`; const tw = ctx.measureText(m).width + 30;
    ctx.fillStyle = 'rgba(30,22,14,0.85)'; ctx.fillRect(W / 2 - tw / 2 - 60, TOP + 8, tw, 30);
    text(m, W / 2 - 60, TOP + 23, 17, '#fff4d8', 'center', true);
  }
  // bottom panel
  ctx.fillStyle = '#2a2118'; ctx.fillRect(0, BOTTOM, W, H - BOTTOM);
  ctx.fillStyle = '#c9a46a'; ctx.fillRect(0, BOTTOM, W, 3);
  const hasMc = state.units.some(u => u.kind === 'mc');
  SHOP.forEach(([k], i) => {
    const r = shopRect(i), c = costOf(k);
    const on = k === 'mc' ? !hasMc : hasMc && state.gold >= c;
    panelBox(r, on, state.placing === k);
    drawPerson(k, r.x + 26, r.y + 66, 1, state.t * 0.3);
    text(`${i + 1}  ${k === 'shield' ? 'Shield' : KINDS[k].name}`, r.x + 50, r.y + 20, 16, on ? '#fff4d8' : '#a89880', 'left', true);
    text(k === 'mc' ? (hasMc ? 'placed' : 'free') : `${c} gold`, r.x + 50, r.y + 42, 15, on ? '#ffd75a' : '#a89880', 'left');
    text(KINDS[k].role, r.x + 50, r.y + 61, 13, '#c9b48a', 'left');
  });
  // hero strike
  const ready = hasMc && state.strikeCd <= 0;
  panelBox(STRIKE_RECT, ready, false);
  text('Q  Strike', STRIKE_RECT.x + 49, STRIKE_RECT.y + 22, 16, ready ? '#9ee7ff' : '#a89880', 'center', true);
  text(state.strikeCd > 0 ? `${Math.ceil(state.strikeCd)} s` : hasMc ? 'ready' : '-', STRIKE_RECT.x + 49, STRIKE_RECT.y + 48, 15, '#c9b48a');
  // the selected person
  const u = state.selected;
  if (u) {
    const st = stats(u);
    text(KINDS[u.kind].name + (u.high ? '  (high ground)' : ''), 722, BOTTOM + 22, 15, '#fff4d8', 'left', true);
    text(`HP ${Math.ceil(u.hp)} / ${Math.round(st.maxhp)}`, 722, BOTTOM + 44, 14, '#c9b48a', 'left');
    text(u.kind === 'support' ? `heal ${st.heal}` : `dmg ${st.dmg.toFixed(1)}`, 722, BOTTOM + 64, 14, '#c9b48a', 'left');
    if (u.kind !== 'mc') {
      for (let p = 0; p < 2; p++) {
        const r = UP_RECT[p], tier = p === 0 ? u.a : u.b, ok = canUp(u, p), c = tier < 4 ? upCost(tier) : 0;
        panelBox(r, ok && state.gold >= c, false);
        text(`${p === 0 ? 'U' : 'I'}  ${KINDS[u.kind].paths[p]}  ${'|'.repeat(tier)}${'.'.repeat(4 - tier)}`, r.x + 10, r.y + 20, 15, '#fff4d8', 'left', true);
        if (ok) { text(KINDS[u.kind].tiers[p][tier], r.x + 10, r.y + 42, 14, '#bff0a0', 'left'); text(`${c} gold`, r.x + 10, r.y + 61, 14, state.gold >= c ? '#ffd75a' : '#a89880', 'left'); }
        else text(capReason(u, p), r.x + 10, r.y + 48, 13, '#a89880', 'left');
      }
      panelBox(SELL_RECT, true, false);
      text('X  Sell', SELL_RECT.x + 38, SELL_RECT.y + 24, 15, '#fff4d8', 'center', true);
      text(`+${Math.floor(u.spent * tune.sell_refund)}`, SELL_RECT.x + 38, SELL_RECT.y + 50, 15, '#ffd75a');
    } else text('Free, placed first. Levels from kills this battle.', 830, BOTTOM + 44, 14, '#c9b48a', 'left');
  } else text('Click a person to see upgrades.', 830, BOTTOM + 44, 15, '#a89880', 'left');
}

// ---- Scenes -----------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#6f9a4c'); text('Figures', W / 2, 60, 32, '#fff', 'center', true);
      const people = ['mc', 'archer', 'shield', 'support', 'villager'], foes = ['walker', 'swarm', 'burrower', 'alpha'];
      const names = { mc: 'Hero', archer: 'Archer', shield: 'Shield Fighter', support: 'Support', villager: 'Villager' };
      people.forEach((k, i) => { const x = 180 + i * 230; drawPerson(k, x, 300, 1, state.t); text(names[k], x, 330, 18, '#fff', 'center', true); });
      foes.forEach((k, i) => { const x = 220 + i * 280; drawEnemy(k, x, 560, 1, state.t); text(ENEMY[k].name, x, 590, 18, '#fff', 'center', true); });
    },
  },
  title: {
    update() { if (pressed('Enter') || pressed('Space') || clicks.length) { clicks.length = 0; reset(); scene = 'play'; } },
    draw() {
      drawGround(); ctx.fillStyle = 'rgba(25,18,10,0.72)'; ctx.fillRect(0, 0, W, H);
      text(TITLE, W / 2, 150, 72, '#ffe2a0', 'center', true);
      text('Your hero is the main tower. The people you met on the road are the rest.', W / 2, 220, 22, '#f2ead2');
      text('Hold the village gate for 10 waves.', W / 2, 252, 22, '#f2ead2');
      ['mc', 'archer', 'shield', 'support'].forEach((k, i) => drawPerson(k, W / 2 - 180 + i * 120, 360, 1, clock.now()));
      CONTROLS.forEach((c, i) => text(c, W / 2, 430 + i * 36, 19, '#d8c8a8'));
      text('Enter or click to start', W / 2, H - 70, 28, '#fff', 'center', true);
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.placing)) { scene = 'pause'; clicks.length = 0; return; }
      if (pressed('Escape')) state.placing = null;
      if (pressed('KeyF')) state.speed = state.speed > 1 ? 1 : 2;
      const mv = 420 * dt;
      if (down.has('ArrowLeft')) mouse.x -= mv; if (down.has('ArrowRight')) mouse.x += mv;
      if (down.has('ArrowUp')) mouse.y -= mv; if (down.has('ArrowDown')) mouse.y += mv;
      mouse.x = Math.max(0, Math.min(W, mouse.x)); mouse.y = Math.max(TOP, Math.min(H, mouse.y));
      SHOP.forEach(([k, code]) => { if (pressed(code)) choose(k); });
      if (pressed('Enter') && state.placing) placeAt(mouse.x, mouse.y);
      while (clicks.length) {
        const c = clicks.shift();
        if (c.right) { state.placing = null; state.selected = null; } else trySelectOrPlace(c.x, c.y);
      }
      if (pressed('KeyU')) upgrade(0);
      if (pressed('KeyI')) upgrade(1);
      if (pressed('KeyX') || pressed('Delete')) sell();
      if (pressed('KeyQ')) heroStrike();
      if (pressed('Space')) startWave();
      for (let i = 0; i < state.speed && scene === 'play'; i++) simStep(dt);
    },
    draw() { drawWorld(); drawHUD(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; clicks.length = 0; },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H); text('Paused', W / 2, H / 2, 56, '#fff', 'center', true); text('P to resume', W / 2, H / 2 + 50, 22, '#ddd'); },
  },
  over: {
    update() { if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; } clicks.length = 0; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(30,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      text(state.gained || 'Game over', W / 2, H / 2 - 50, 54, '#ffb0a0', 'center', true);
      text(`You held until wave ${state.wave}. Villagers saved: ${state.saved}.`, W / 2, H / 2 + 10, 24, '#f2ead2');
      text('R to restart', W / 2, H / 2 + 60, 26, '#fff');
    },
  },
  results: {
    update() { if (pressed('Enter') || pressed('KeyR')) { reset(); scene = 'play'; } clicks.length = 0; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(10,20,0,0.55)'; ctx.fillRect(0, 0, W, H);
      text(state.gained, W / 2, H / 2 - 60, 56, '#ffe2a0', 'center', true);
      text(`All ${CONFIG.waves.length} waves held. Gate ${Math.ceil(state.gate)} / ${tune.gate_hp}. Villagers saved: ${state.saved}. Hero level ${state.mcLevel}.`, W / 2, H / 2 + 4, 22, '#f2ead2');
      text('Enter to play again', W / 2, H / 2 + 56, 26, '#fff');
    },
  },
};

// ---- Loop -------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
  if (scene !== 'play') clicks.length = 0;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); if (muted) text('muted (M)', W - 20, H - 104, 13, '#c9b48a', 'right'); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
